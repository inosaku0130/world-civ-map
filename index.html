<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORLD CIVILIZATIONS ヘックス世界地図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Shippori+Mincho:wght@600;800&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* layout: one-screen strategy-game HUD. top bar / map with floating tool docks / right command panel */
:root{
  color-scheme:dark;
  --ink:#0c1016; --hull:#151b24; --plate:#1d2530; --plate2:#263040; --rule:#3b3526;
  --brass:#c9a45c; --brass-hi:#f0d79a; --paper:#e8e1cf; --dim:#948d7d;
  --sea:#10283b; --sea-deep:#0b1c2b;
  --war:#e5483a; --warn:#e79a3c; --calm:#6fb07a; --ua:#4a8be0;
  --f-display:"Cinzel","Shippori Mincho",serif; --f-head:"Shippori Mincho","Hiragino Mincho ProN",serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font:14px/1.55 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
#top{display:flex;align-items:center;gap:18px;padding:8px 16px;background:linear-gradient(#1c1710,#13100b);border-bottom:1px solid var(--rule);box-shadow:inset 0 -2px 0 rgba(201,164,92,.18);flex:none;flex-wrap:wrap}
#top h1{margin:0;font:800 17px var(--f-display);letter-spacing:.14em;color:var(--brass-hi)}
#top h1 small{display:block;font:500 10.5px var(--f-body);letter-spacing:.22em;color:var(--dim)}
.ticks{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.tick{padding:4px 10px;border:1px solid var(--rule);border-radius:4px;background:rgba(0,0,0,.3);min-width:150px}
.tick .k{font-size:10px;color:var(--dim);letter-spacing:.06em}
.tick .v{font-size:13.5px;color:var(--brass-hi)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--war);margin-right:5px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}

/* body */
#body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 392px;min-height:0}
#stage{position:relative;min-height:0;background:var(--sea-deep);overflow:hidden;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.dock{position:absolute;background:rgba(14,18,25,.9);border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);backdrop-filter:blur(4px)}
#lensDock{left:12px;top:12px;padding:8px;display:flex;flex-direction:column;gap:4px;max-height:calc(100% - 24px);overflow:auto}
.dockT{font:600 10px var(--f-display);letter-spacing:.2em;color:var(--brass);padding:2px 6px 4px}
.lens{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:5px;padding:5px 9px;font-size:12.5px;text-align:left;white-space:nowrap}
.lens i{width:10px;height:10px;border-radius:2px;flex:none;transform:rotate(45deg)}
.lens:hover{background:var(--plate)}
.lens[aria-pressed="true"]{background:linear-gradient(#3b2f18,#2a2212);border-color:var(--brass);color:var(--brass-hi)}
.tog{display:flex;align-items:center;gap:8px;padding:4px 9px;font-size:12.5px;cursor:pointer}
.tog input{accent-color:var(--brass);width:14px;height:14px;margin:0}
#zoomDock{right:12px;top:12px;display:flex;flex-direction:column;overflow:hidden}
#zoomDock button{background:none;border:0;border-bottom:1px solid var(--rule);width:38px;height:36px;font-size:17px}
#zoomDock button:last-child{border:0;font-size:11px}
#zoomDock button:hover{background:var(--plate2)}
#miniDock{left:12px;bottom:12px;padding:5px}
#mini{position:static!important;width:210px!important;height:90px!important;border-radius:4px;cursor:pointer}
#legend{right:12px;bottom:12px;padding:9px 11px;font-size:11.5px;max-width:300px}
#legend .t{color:var(--brass);font-weight:600;margin-bottom:5px}
#legend .bar{height:8px;border-radius:2px;margin:3px 0}
#legend .ends{display:flex;justify-content:space-between;color:var(--dim)}
.lg{display:grid;grid-template-columns:repeat(2,auto);gap:3px 12px;margin-top:6px;padding-top:6px;border-top:1px solid var(--rule)}
.lg span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.lg svg{flex:none}
#tile{left:234px;bottom:12px;padding:8px 12px;font-size:12px;min-width:220px;max-width:calc(100% - 560px)}
#tile b{color:var(--brass-hi)}
#tile .r{color:var(--dim)}
#tip{position:fixed;pointer-events:none;background:#0a0d12;border:1px solid var(--brass);border-radius:5px;padding:6px 9px;font-size:12px;opacity:0;z-index:20;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.6)}
#tip b{color:var(--brass-hi)}

/* command panel */
#panel{background:linear-gradient(var(--plate),var(--hull));border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex:none;border-bottom:1px solid var(--rule)}
#tabs button{flex:1 1 auto;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px;font:600 12.5px var(--f-head);letter-spacing:.08em;color:var(--dim)}
#tabs button[aria-selected="true"]{color:var(--brass-hi);border-bottom-color:var(--brass);background:rgba(201,164,92,.06)}
#pane{flex:1;overflow:auto;padding:14px}
h2{font:800 19px var(--f-head);margin:0;color:var(--brass-hi);text-wrap:balance}
.sec{font:600 10.5px var(--f-display);letter-spacing:.2em;color:var(--brass);margin:16px 0 7px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
.note{font-size:11.5px;color:var(--dim);line-height:1.6}
.war{border:1px solid var(--rule);border-left:4px solid var(--war);border-radius:6px;background:rgba(0,0,0,.22);padding:10px 12px;margin-bottom:9px;cursor:pointer;transition:background .12s}
.war:hover{background:rgba(201,164,92,.07)}
.war.on{border-color:var(--brass);border-left-color:var(--war);background:rgba(201,164,92,.09)}
.war h3{margin:0;font:800 14.5px var(--f-head);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:600 10px var(--f-body);padding:1px 7px;border-radius:999px;border:1px solid currentColor;letter-spacing:.04em;white-space:nowrap}
.pill.s3{color:var(--war)} .pill.s2{color:var(--warn)} .pill.s1{color:var(--dim)}
.vs{display:flex;align-items:center;gap:6px;font-size:12px;margin:5px 0 2px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip i{width:9px;height:9px;border-radius:2px}
.gauge{margin-top:7px}
.gauge .lab{display:flex;justify-content:space-between;font-size:11.5px;gap:8px}
.gauge .lab b{font-family:var(--f-mono);color:var(--brass-hi);font-weight:500}
.track{height:9px;border-radius:5px;overflow:hidden;background:#0a0d12;border:1px solid #2c323c;margin-top:3px;display:flex}
.track div{height:100%}
.sub{display:grid;grid-template-columns:104px 1fr 48px;gap:8px;align-items:center;font-size:11.5px;margin-top:4px}
.sub .track{margin:0;height:6px}
.war ul{margin:8px 0 0;padding-left:16px;font-size:12px;line-height:1.6}
.war .src{font-size:10.5px;color:var(--dim);margin-top:6px}
.war .more{display:none}
.war.on .more{display:block}
.minor{display:flex;flex-wrap:wrap;gap:6px}
.minor button{background:var(--plate2);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:11.5px}
.minor button:hover{border-color:var(--brass)}
.ph{display:flex;align-items:center;gap:10px}
.flag{font-size:36px;line-height:1}
.ph .subt{font-size:11.5px;color:var(--dim)}
.rank{margin-left:auto;text-align:center;border:1px solid var(--brass);border-radius:6px;padding:2px 9px}
.rank .k{font-size:9.5px;color:var(--dim)} .rank .v{font:800 19px var(--f-display);color:var(--brass-hi)}
.stat{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.stat .k{color:var(--dim)} .stat .track{margin:0;height:7px} .stat .v{min-width:96px;text-align:right}
.stat .rk{color:var(--dim);font-size:10.5px}
.live{border:1px solid rgba(229,72,58,.35);background:rgba(229,72,58,.06);border-radius:6px;padding:8px 10px;margin-top:10px;font-size:12px}
.live div{display:flex;justify-content:space-between;gap:8px;margin:2px 0}
.live .mono{color:var(--brass-hi)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span,.tags button{background:var(--plate2);border:1px solid var(--rule);border-radius:999px;padding:2px 9px;font-size:11.5px}
.tags button:hover{border-color:var(--brass)}
.relbar{display:flex;height:13px;border-radius:3px;overflow:hidden;border:1px solid #2c323c}
.rl{font-size:11px;color:var(--dim);margin-top:4px}
.row{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #232a34;font-size:12.5px;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:hover{background:rgba(201,164,92,.07)}
.row .n{color:var(--dim)}
.alert{border:1px solid var(--war);color:#ffb3a8;border-radius:5px;padding:5px 9px;font-size:12px;margin-top:8px;background:rgba(229,72,58,.08)}

#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-80px);transition:transform .35s;background:#14100a;border:1px solid var(--brass);border-left:4px solid var(--war);border-radius:6px;padding:8px 14px;font-size:12.5px;max-width:min(520px,70%);cursor:pointer;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#toast.on{transform:translate(-50%,0)}
#toast b{color:var(--brass-hi);font-family:var(--f-display);letter-spacing:.14em;font-size:10.5px;margin-right:8px}
.nw{border:1px solid var(--rule);border-left:4px solid var(--dim);border-radius:6px;background:rgba(0,0,0,.22);padding:9px 12px;margin-bottom:8px;cursor:pointer}
.nw:hover{background:rgba(201,164,92,.07)}
.nw.on{border-color:var(--brass);background:rgba(201,164,92,.09)}
.nw h3{margin:3px 0 4px;font:800 14px/1.45 var(--f-head);text-wrap:balance}
.nw .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--dim);flex-wrap:wrap}
.nw p{margin:0;font-size:12px;line-height:1.6}
.nw a{color:var(--brass-hi);font-size:11px}
.new{color:#fff;background:var(--war);border-radius:3px;padding:0 5px;font:600 9.5px var(--f-display);letter-spacing:.1em}
.badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;border-radius:8px;background:var(--war);color:#fff;font:600 10px var(--f-mono);line-height:16px}
.status{font-size:11.5px;color:var(--dim);border:1px dashed var(--rule);border-radius:5px;padding:6px 9px;margin:6px 0 12px}
.srcs{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px}
.srcs span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.srcs i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.srcs .s-ok i{background:var(--calm)} .srcs .s-err i{background:var(--war)}
@media(max-width:900px){
  body{overflow:auto;height:auto}
  #body{grid-template-columns:1fr;grid-template-rows:68vh auto}
  #panel{border-left:0;border-top:1px solid var(--rule)}
  #pane{overflow:visible}
  #tile,#legend .lg{display:none}
  #legend{max-width:170px}
  #mini{width:130px!important;height:56px!important}
  .ticks .tick:nth-child(n+2){display:none}
}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>

<header id="top">
  <h1>WORLD CIVILIZATIONS<small>ヘックス世界地図 ／ 都市・軍事拠点・戦況</small></h1>
  <div class="ticks">
    <div class="tick"><div class="k"><span class="dot"></span>世界人口（推計）</div><div class="v mono" id="wPop">—</div></div>
    <div class="tick"><div class="k"><span class="dot"></span>今年の世界GDP（累計推計）</div><div class="v mono" id="wGdp">—</div></div>
    <div class="tick"><div class="k">ターン</div><div class="v mono" id="turn">—</div></div>
  </div>
</header>
<div id="body">
  <div id="stage">
    <canvas id="map"></canvas><canvas id="fx"></canvas>
    <div class="dock" id="lensDock">
      <div class="dockT">LENS</div><div id="lenses" style="display:flex;flex-direction:column;gap:2px"></div>
      <div class="dockT" style="margin-top:6px">LAYERS</div>
      <label class="tog"><input type="checkbox" id="lyWar" checked>戦況・前線</label>
      <label class="tog"><input type="checkbox" id="lyNews" checked>ニュースのピン</label>
      <label class="tog"><input type="checkbox" id="lyCity" checked>都市</label>
      <label class="tog"><input type="checkbox" id="lyBase" checked>軍事拠点</label>
    </div>
    <div class="dock" id="zoomDock"><button id="zin" aria-label="拡大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zall">全体</button></div>
    <div class="dock" id="miniDock"><canvas id="mini" width="420" height="180" aria-label="ミニマップ"></canvas></div>
    <div class="dock" id="tile">タイルにカーソルを合わせると情報を表示します</div>
    <div class="dock" id="legend"></div>
    <div id="toast" role="status"></div>
  </div>
  <aside id="panel">
    <div id="tabs" role="tablist">
      <button role="tab" data-t="war" aria-selected="true">戦況</button>
      <button role="tab" data-t="news" aria-selected="false">ニュース<span id="nbadge"></span></button>
      <button role="tab" data-t="civ" aria-selected="false">国家</button>
      <button role="tab" data-t="rank" aria-selected="false">ランキング</button>
      <button role="tab" data-t="about" aria-selected="false">出典</button>
    </div>
    <div id="pane"></div>
  </aside>
</div>
<div id="tip"></div>

const classify=t=>{for(const[k,re]of KW)if(re.test(t))return k;return"other"};
const h32=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0)};
const jit=(id,v,amp)=>v+((h32(id+"x"+amp)%1000)/1000-.5)*amp;
async function getJSON(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||15000);try{const r=await fetch(url,{signal:c.signal,cache:"no-store"});if(!r.ok)throw new Error(r.status);return await r.json();}finally{clearTimeout(t);}}
const FETCHERS={
 async file(){const j=await getJSON("news.json?t="+Date.now());SRC.file.upd=Date.parse(j.updatedAt)||null;return(j.items||[]).map(normItem);},
 async usgs(){const j=await getJSON("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson");return j.features.filter(f=>f.properties.mag>=5).map(f=>{const p=f.properties,g=f.geometry.coordinates;return normItem({id:"usgs-"+f.id,title:`M${p.mag.toFixed(1)} の地震${p.tsunami?"（津波情報あり）":""}`,summary:`震源：${p.place||"不明"}／深さ約${Math.round(g[2])}km。米国地質調査所（USGS）の速報値で、後から修正されることがあります。`,lat:g[1],lon:g[0],cat:"disaster",at:new Date(p.time).toISOString(),source:"USGS",url:p.url,place:p.place||""})});},
 async eonet(){const j=await getJSON("https://eonet.gsfc.nasa.gov/api/v3/events?status=open&days=10&category=volcanoes,severeStorms,floods&limit=40",25000);const JA={volcanoes:"火山活動",severeStorms:"暴風雨・台風",floods:"洪水"};
   return(j.events||[]).map(e=>{const g=e.geometry&&e.geometry[e.geometry.length-1];if(!g||g.type!=="Point")return null;const c=e.categories&&e.categories[0]&&e.categories[0].id;return normItem({id:"eonet-"+e.id,title:`${JA[c]||"自然災害"}：${e.title}`,summary:"NASAの自然現象トラッカー（EONET）が追跡中の事象です。位置は最新の観測点です。",lat:g.coordinates[1],lon:g.coordinates[0],cat:"disaster",at:g.date,source:"NASA EONET",url:e.link||(e.sources&&e.sources[0]&&e.sources[0].url)||"",place:e.title})}).filter(Boolean);},
 async wb(){const ISO={"840":"USA","156":"CHN","276":"DEU","392":"JPN","356":"IND","826":"GBR","250":"FRA","380":"ITA","124":"CAN","076":"BRA","643":"RUS","410":"KOR","036":"AUS","724":"ESP","484":"MEX","360":"IDN","528":"NLD","792":"TUR","682":"SAU","756":"CHE","616":"POL","032":"ARG","364":"IRN","376":"ISR","784":"ARE","818":"EGY","566":"NGA","710":"ZAF","586":"PAK","704":"VNM","764":"THA","608":"PHL","804":"UKR","578":"NOR","752":"SWE","862":"VEN"},by={};Object.entries(ISO).forEach(([id,i])=>by[i]=byId[id]);
   const j=await getJSON("stats.json?t="+Date.now());let n=0;
   for(const[iso,v]of Object.entries(j.countries||{})){const d=by[iso];if(!d)continue;for(const[key,div]of[["gdp",1e9],["pop",1e6],["mil",1e9]]){const x=v[key];if(!x||!(x[0]>0))continue;d[key]=x[0]/div;(d.wb||(d.wb={}))[key]=x[1];n++;}}
   if(!n)throw new Error("empty");SRC.wb.count=n;derive();recolor();legend();redraw();if(tab!=="news")render();return[];}
};
function mergeNews(key,items,first){const sel=selNews&&selNews.id,before=new Set(NEWS.map(n=>n.id)),born={};NEWS.forEach(n=>{if(n.born)born[n.id]=n.born});SRC[key].items=items.filter(okItem);
  const ids=new Set();NEWS=[].concat(...Object.keys(SRC).map(k=>SRC[k].items)).filter(n=>!ids.has(n.id)&&ids.add(n.id)).sort((a,b)=>b.at-a.at);NEWS.forEach(n=>{if(born[n.id])n.born=born[n.id]});
  selNews=NEWS.find(n=>n.id===sel)||null;newsUpdated=Math.max(...Object.values(SRC).map(s=>s.t||0));
  if(!first){const fresh=NEWS.filter(n=>!before.has(n.id)&&Date.now()-n.at<6*36e5);fresh.forEach(n=>n.born=performance.now());if(fresh.length)toast(fresh[0]);}
  badge();if(tab==="news")render();if(reduce)drawFx(0);}
async function pull(key){const S=SRC[key];if(S.busy)return;S.busy=true;try{const items=await FETCHERS[key]();const first=!S.t;S.st="ok";S.t=Date.now();mergeNews(key,items,first);}catch(e){if(S.st!=="ok")S.st="err";S.fail=Date.now();if(tab==="news")render();}finally{S.busy=false;newsState="ok";}}
function initNews(){Object.keys(SRC).forEach((k,i)=>{setTimeout(()=>pull(k),i*900);if(SRC[k].every)setInterval(()=>{if(!document.hidden)pull(k)},SRC[k].every*1000);});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)["file","usgs"].forEach(pull)});}
window.__places=()=>PLACES;
function selectCountry(k){selK=k;selEdges=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r*COLS+c]!==k)continue;for(let d=0;d<6;d++){const[nc,nr]=nb(c,r,d);if(gAt(nc,nr)!==k)selEdges.push([c,r,d]);}}setTab("civ");if(reduce)drawFx(0);}
function selectWar(w,fly){selWar=selWar===w&&!fly?null:w;if(tab!=="war")setTab("war");else render();if(selWar){flyTo(w.center[0],w.center[1],Math.min(w.zoom,Math.max(10,VW/40)));const el=pane.querySelector(`[data-w="${w.id}"]`);if(el)el.scrollIntoView({block:"nearest"});}}

/* ---------- live counters ---------- */
const BASE=Date.UTC(2024,6,1),YMS=365.2425*864e5;
const yf=n=>{const y=n.getFullYear(),s=new Date(y,0,1),e=new Date(y+1,0,1);return(n-s)/(e-s)};
function tick(){const n=new Date(),yrs=n.getFullYear()-2024,f=yf(n);
  document.getElementById("wPop").textContent=Math.round(8161e6*Math.pow(1.0085,(n-BASE)/YMS)).toLocaleString("ja-JP")+" 人";
  document.getElementById("wGdp").textContent="$"+Math.round(110000e9*Math.pow(1.03,yrs)*f).toLocaleString("en-US");
  document.getElementById("turn").textContent=`${n.getFullYear()}年 第${Math.floor(f*365)+1}日 ${n.toLocaleTimeString("ja-JP")}`;
  if(tab==="civ"&&selK>=0&&CN[selK].d){const d=CN[selK].d,a=document.getElementById("lvPop"),b=document.getElementById("lvGdp");if(a)a.textContent=Math.round(d.pop*1e6*Math.pow(1+d.pg/100,(n-BASE)/YMS)).toLocaleString("ja-JP")+" 人";if(b)b.textContent="$"+Math.round(d.gdp*1e9*Math.pow(1+d.g/100,yrs)*f).toLocaleString("en-US");}}
setInterval(tick,500);

/* ---------- init ---------- */
recolor();legend();render();
VW=stage.clientWidth;VH=stage.clientHeight;W=Math.max(7.5,VW/125);{const[wx,wy]=wxy(44,34);ox=VW/2-wx*W;oy=VH/2-wy*rs()-sz();}
resize();new ResizeObserver(resize).observe(stage);tick();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
requestAnimationFrame(loop);initNews();setInterval(()=>{badge();if(tab==='news'&&!pane.matches(':hover'))render();},300000);
window.__dbg=()=>WARS.map(w=>[w.id,w.zones.map(z=>z.n+"/"+CN[z.k].cells)]);
</script>
